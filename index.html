<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotogram Website</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="./assets/icon/Group.svg" type="image/svg+xml">
    <script src="./script.js" defer></script>
</head>

<body onload="init()">
    <header>
        <div class="content-container header-content">
            <img src="./assets/icon/Group.svg" alt="Fotogram website logo">
            <p>Fotogram</p>
        </div>
    </header>

    <main>
        <section class="album-container content-container">
            <h1>Your Personal Photo Album</h1>

            <div id="myPhotoCollection" class="photo-collection">
                <!-- Images are created dynamically using JavaScript -->
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-content content-container">
            <div class="footer-content-company-information">
                <img src="./assets/icon/developer_akademie.svg" alt="Developer Akademie">
                <p>Developer Akademie</p>
            </div>

            <div class="footer-content-company-address">
                <img src="./assets/icon/copyright.svg" alt="Copyright">
                <p>2023 Developer Akademie GmbH</p>
            </div>
        </div>
    </footer>

    <!-- Dialog for image preview -->
    <dialog id="myDialog" class="picture-dialog" aria-labelledby="dialogTitle">
        <div class="picture-dialog-header">
            <h2 id="dialogTitle"></h2>

            <button
                id="dialogClose"
                type="button"
                class="picture-dialog-header-closing-picture"
                aria-label="Close dialog"
                autofocus>
            </button>
        </div>

        <div class="picture-dialog-content">
            <img id="dialogImage" alt="">
        </div>

        <div class="picture-dialog-footer">
            <button
                id="dialogPrevious"
                type="button"
                class="arrow-button arrow-left"
                aria-label="Previous image">
            </button>

            <p id="dialogCounter"></p>

            <button
                id="dialogNext"
                type="button"
                class="arrow-button arrow-right"
                aria-label="Next image">
            </button>
        </div>
    </dialog>
</body>

</html>
